[workspace]
resolver = "3"
members = [
    "examples",
    "examples/domain-modeling",
    "examples/validated-newtypes",
    "examples/typestate",
    "examples/staged-protocol",
    "examples/boundary-validation",
    "examples/distributed-outcomes",
    "examples/unsafe-evidence",
    "examples/compile-fail",
    "tools/doctrine-manifest",
    "tools/doctrine-lint",
    "tools/bundle-agent-context",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"
repository = "https://github.com/fluminis-scientiae-oraculum/doctrines-rust"

[workspace.dependencies]
doctrine-manifest = { version = "0.9.0", path = "tools/doctrine-manifest" }
jsonschema = { version = "0.49.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
trybuild = "1.0.118"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
