[workspace]
resolver = "3"
members = [
    "examples",
    "examples/domain-modeling",
    "examples/validated-newtypes",
    "examples/typestate",
    "examples/staged-protocol",
    "examples/boundary-validation",
    "examples/distributed-outcomes",
    "examples/unsafe-evidence",
    "examples/compile-fail",
    "tools/doctrine-manifest",
    "tools/doctrine-lint",
    "tools/bundle-agent-context",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"
repository = "https://github.com/fluminis-scientiae-oraculum/doctrines-rust"

[workspace.dependencies]
doctrine-manifest = { version = "0.9.0", path = "tools/doctrine-manifest" }
jsonschema = { version = "0.49.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
toml = "1.1.4"
trybuild = "1.0.118"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Selected lints from the unstable `nursery` group, named individually rather than
# enabled as a group. The group as a whole moves between toolchains, and this workspace
# pins one; naming each lint keeps a toolchain bump from turning unrelated new lints into
# build failures, while still holding the corpus to the idiom it teaches.
#
# `missing_const_for_fn` found nine functions across the examples and both binaries that
# could be `const` and were not. A doctrine repository about making guarantees visible in
# the type system should not leave compile-time evaluability implicit.
missing_const_for_fn = "deny"
# `ptr_arg` (already in `all`) rejects a `&String` or `&Vec<T>` parameter. These two
# reject the same shape where it is produced rather than consumed: collecting references
# to owned types instead of the borrowed view.
ref_option_ref = "deny"
redundant_clone = "deny"

# Waiver, scoped and reasoned rather than silent. `option_if_let_else` rewrites a
# two-armed `match` on an `Option` into `map_or_else`, whose arguments are the default
# FIRST and the mapping second — the reverse of the reading order, and a documented
# source of transposed-argument mistakes. This corpus optimises for a reader following
# prose and code together, so the named-variant `match` stays. Revisit if the lint learns
# to leave the legible form alone.
option_if_let_else = "allow"
