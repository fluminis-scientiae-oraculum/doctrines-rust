name: Rust Examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Examples (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSRV 1.85.0
            toolchain: "1.85.0"
          - name: stable 1.97.1
            toolchain: "1.97.1"
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install matrix toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-16
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Test executable examples and compiler rejection evidence
        run: >-
          cargo test --locked
          -p doctrine-examples
          -p domain-modeling
          -p validated-newtypes
          -p typestate
          -p staged-protocol
          -p boundary-validation
          -p distributed-outcomes
          -p unsafe-evidence
          -p doctrine-compile-fail

  miri:
    name: Unsafe evidence (Miri nightly-2026-07-13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-13

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly with Miri
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-16
        with:
          toolchain: nightly-2026-07-13
          components: miri, rust-src

      - name: Prepare Miri sysroot
        run: cargo miri setup

      - name: Interpret unsafe evidence
        run: cargo miri test --locked -p unsafe-evidence

  # A stable context for branch protection to require.
  #
  # The jobs above carry version-bearing names — the matrix renders
  # "Examples (MSRV 1.85.0)" and the Miri job pins a nightly date. A ruleset that
  # required those names by hand would silently block every pull request the day
  # either version moved, because the required context would simply never appear.
  # This job's name never moves, so the toolchains can.
  rust-success:
    name: Rust examples and unsafe evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [examples, miri]
    if: always()

    steps:
      # `needs` alone does not fail this job when a dependency is skipped or
      # cancelled; `if: always()` means it runs regardless, so the results are
      # inspected explicitly rather than inferred from reaching this step.
      - name: Require every Rust job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required Rust job did not succeed: ${result}" >&2
              exit 1
            fi
          done
