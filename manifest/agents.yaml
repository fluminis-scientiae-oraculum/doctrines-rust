schema_version: "1.0"
packs:
  - id: shared
    purpose: Common obligations and doctrine navigation for every agent role.
    maximum_verbosity: operational
    ordering: 10
    canonical_sources:
      - agents/shared.md
      - foundations/invariants.md
      - foundations/evidence.md
      - foundations/trust-boundaries.md
      - foundations/guarantee-honesty.md
      - foundations/complexity-budget.md
    doctrine_selections:
      - RUST-DOC-0001
      - RUST-DOC-0002
      - RUST-DOC-0006
      - RUST-DOC-0008
      - RUST-DOC-0011
    review_checklists:
      - reviews/final-correctness-audit.md
    output_path: dist/agents/shared.md
